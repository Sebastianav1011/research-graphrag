# Catálogo de rutas de GraphRag: clasificación documental, comprobada el 2026-11-20.
#
# NO es una fuente de resolución de rutas. Ningún código lee este archivo.
# La resolución sigue a cargo de layer2_processing.checkpoints.registry()/resolve(), que combina:
#   outputs/layer4/auditoria/rutas.json
#   docs/architecture/auditoria_consolidacion/relocations.json   (local, excluido de Git; opcional)
#   config/sad_relocations.json            (prefixes, file_aliases, runtime_bindings)
#   outputs/runs/.relocations.json         (localizadores de runs, src/run_paths.py)
# No se copian aquí sus alias. Todo outputs/ es privado y está excluido de Git.
# Antecedente local, no versionado (docs/status/ está excluido de Git): la auditoría de solo lectura
# docs/status/auditoria_outputs_layer234.md, con su inventario CSV por archivo de outputs/layer2-4.
#
# Campos:
#   categoria: ACTUAL | COMPARTIDO | HISTORICO | EXPERIMENTAL
#   run_nuevo: escribe | lee | lee_si_rebuild | lee_export_autonomo | no
#   fijada_por: manifiestos, verificadores o sellos que dependen de bytes o de la ruta
#   autorizada_por: regla que solo autoriza la ubicación de un directorio de primer nivel de outputs/
#                   (OUTPUT_DIRECTORIES); no fija bytes ni hashes
#   regenerable: si | no | solo_con_inferencia | solo_con_build (con coste)
#   conservar_ubicacion: true si mover la ruta rompería un consumidor, un manifiesto o un verificador
#   estado: resultado de la comprobación de solo lectura del 2026-11-20
#
# Validación del layout (2026-11-20, tras registrar audits y pilotos en OUTPUT_DIRECTORIES):
#   tests/test_output_layout.py + tests/layer5_experiment/test_layout_relocation.py: 9/9 pasan.
#   Selección de consumidores (test_prospective_v2_closure, test_prospective_v2_decisions,
#   test_semantic_correction_v2, test_claude_recommendations, test_output_layout): 89/89 pasan.
#   Línea base histórica sin cambios: 42/1.854 diferencias del verificador V2 (protected_inputs)
#   y 32 errores de verify_layout. El plan V3.3 sigue con sus 13 recursos íntegros.
version: 1
comprobado: '2026-11-20'
entrypoint: run.py -> scripts/pipeline_coordinator.py (execute_pipeline) | src/autonomous_execution/cli.py

# Directorios de primer nivel de outputs/ autorizados por tests/test_output_layout.py (OUTPUT_DIRECTORIES).
# Autorizar una ubicación no equivale a fijarla por hash; las fijaciones reales están en fijada_por de cada ruta.
directorios_autorizados:
  fuente: tests/test_output_layout.py OUTPUT_DIRECTORIES
  obligatorios: [layer2, layer3, layer4, runs]
  permitidos: [layer2, layer3, layer4, runs, shared, historico, reviews, audits, pilotos]

rutas:

