  - ruta: run.py
    categoria: ACTUAL
    capa: orquestacion
    productor: repositorio
    consumidores: [usuario]
    run_nuevo: lee
    fijada_por: [runtime_bindings (config/sad_relocations.json)]
    regenerable: no
    conservar_ubicacion: true
    estado: OK (import verificado)

  - ruta: scripts/pipeline_coordinator.py
    categoria: ACTUAL
    capa: orquestacion
    productor: repositorio
    consumidores: [run.py, src/autonomous_execution/*, src/run_storage.py, src/run_retention.py]
    run_nuevo: lee
    fijada_por: [code_hashes de cada run (src/layer2_processing/pipeline.py:10)]
    regenerable: no
    conservar_ubicacion: true
    estado: OK

  - ruta: src/
    categoria: ACTUAL
    capa: todas
    productor: repositorio
    consumidores: [run.py]
    run_nuevo: lee
    fijada_por: ['code_hashes (todos los *.py) de cada run', 'identidad de Knowledge BASE (layer2_processing/{preprocessing,knowledge}, layer3_graphrag)']
    regenerable: no
    conservar_ubicacion: true
    estado: OK (12 módulos de entrada importan)

  - ruta: config/pipeline_manual.json
