[project]
name = "research-graphrag"
version = "0.1.0"
description = "Pipeline institucional GraphRAG y evaluación reproducible de indicadores"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyarrow==23.0.1",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "sentence-transformers==5.2.3",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "torch==2.11.0",
    "tokenizers==0.22.2",
    "requests==2.34.2",
    "certifi==2026.7.22",
    "openai>=2.0.0,<3",
    "keyring>=25.0.0,<26",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
pdf = ["pypdf>=6.10,<7"]
performance = ["psutil>=7.0,<8", "nvidia-ml-py>=12"]

[tool.uv]
required-version = ">=0.13.7"
package = false
# Preserve the established runtime; updates require an intentional lock change.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
constraint-dependencies = [
    "attrs==26.1.0", "certifi==2026.7.22", "charset-normalizer==3.5.2",
    "cloudpickle==3.1.2", "colorama==0.4.6", "et-xmlfile==2.0.0",
    "filelock==3.32.3", "fsspec==2026.7.0", "huggingface-hub==0.36.2",
    "idna==3.20", "Jinja2==3.1.6", "joblib==1.6.0",
    "jsonschema==4.26.0", "jsonschema-specifications==2025.9.1",
    "MarkupSafe==3.0.3", "mpmath==1.3.0", "networkx==3.6.1",
    "narwhals==2.27.1", "numpy==2.5.3", "openpyxl==3.1.5",
    "packaging==26.3", "pandas==3.0.6", "pyarrow==23.0.1",
    "python-dateutil==2.9.0.post0", "PyYAML==6.0.3", "referencing==0.37.0",
    "regex==2026.9.29", "requests==2.34.2", "rpds-py==2026.9.1",
    "safetensors==0.8.0", "scikit-learn==1.9.1", "scipy==1.18.1",
    "sentence-transformers==5.2.3", "setuptools==78.1.0", "six==1.17.0",
    "sympy==1.14.0", "threadpoolctl==3.7.0", "tokenizers==0.22.2",
    "torch==2.11.0", "tqdm==4.70.1", "transformers==4.57.6",
    "typing-extensions==4.16.0", "tzdata==2026.5", "urllib3==2.8.0",
    "iniconfig==2.3.0", "pluggy==1.6.0", "Pygments==2.21.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
